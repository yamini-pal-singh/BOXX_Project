[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "boxx-test-automation"
version = "1.0.0"
description = "BOXX Chatbot Test Automation Suite — data-driven Python test suite for scam-detection chatbot testing"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "pytest>=7.4",
    "pytest-html>=4.0",
    "openpyxl>=3.1",
    "pandas>=2.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["."]
# Logging in test output
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"
# Verbose output by default
addopts = "-v"
# Markers
markers = [
    "smoke: quick smoke test to verify API reachability",
    "sample: test using built-in sample data (runs without a sheet file)",
]
